[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsmvrp-neural-warm-start"
version = "0.1.0"
description = "Fleet-aware neural construction and PyVRP warm starts for FSMVRP"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
hybrid = ["pyvrp==0.14.0"]

[tool.setuptools.packages.find]
include = ["fsmvrp*", "baselines*"]
